name: Build and deploy Final Teenage Arc

on:
  push:
    branches: [main]
    paths:
      - 'final-teenage-arc-final.zip'
      - '.github/workflows/deploy.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: false

      - name: Extract application source
        run: |
          unzip -q final-teenage-arc-final.zip
          test -f final-teenage-arc-v2/package.json
          test -f final-teenage-arc-v2/src/main.jsx

      - name: Install dependencies and build
        working-directory: final-teenage-arc-v2
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base=/FinalTeenageArc/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: final-teenage-arc-v2/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
