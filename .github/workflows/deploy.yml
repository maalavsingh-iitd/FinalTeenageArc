name: Build and deploy Final Teenage Arc

on:
  push:
    branches: [main]
    paths:
      - 'final-teenage-arc-final.zip'
      - '.github/workflows/deploy.yml'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extract application source
        run: |
          mkdir -p final-teenage-arc-v2
          unzip -q final-teenage-arc-final.zip -d final-teenage-arc-v2
          test -f final-teenage-arc-v2/package.json
          test -f final-teenage-arc-v2/src/main.jsx

      - name: Apply timer fix
        run: python3 scripts/fix_focus_timer.py

      - name: Install dependencies and build
        working-directory: final-teenage-arc-v2
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base=/FinalTeenageArc/

      - name: Refresh source archive with fixed code
        run: |
          rm -f final-teenage-arc-final.zip
          cd final-teenage-arc-v2
          zip -qr ../final-teenage-arc-final.zip package.json index.html README.md src
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add final-teenage-arc-final.zip
          if ! git diff --cached --quiet; then
            git commit -m "Update source archive with background-safe focus timer"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload built site
        uses: actions/upload-pages-artifact@v3
        with:
          path: final-teenage-arc-v2/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
